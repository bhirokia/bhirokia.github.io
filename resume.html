<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert Albani - Resume</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            color: #e4e4e7;
            line-height: 1.7;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(90deg, rgba(79, 192, 255, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(79, 192, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1a1a1a;
            z-index: 100;
            padding: 20px 0;
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .nav-container a {
            font-family: 'Space Mono', monospace;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.88em;
            transition: color 0.3s ease;
        }

        .nav-container a::before {
            content: '// ';
            color: #64748b;
        }

        .nav-container a:hover,
        .nav-container a.active {
            color: #4fc0ff;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 120px 40px 60px;
            position: relative;
            z-index: 1;
            animation: slideUp 0.8s ease-out;
        }

        .resume-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }

        h2 {
            font-family: 'Space Mono', monospace;
            font-size: 1.8em;
            font-weight: 700;
            color: #4fc0ff;
            position: relative;
            display: inline-block;
        }

        h2::before {
            content: '// ';
            color: #64748b;
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #4fc0ff, transparent);
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Space Mono', monospace;
            color: #4fc0ff;
            text-decoration: none;
            font-size: 0.9em;
            padding: 8px 16px;
            border: 1px solid #4fc0ff;
            border-radius: 3px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(79, 192, 255, 0.1);
            color: #fafafa;
        }

        .btn.primary {
            background: #4fc0ff;
            color: #000;
            font-weight: 700;
        }

        .btn.primary:hover {
            background: #7fd2ff;
            color: #000;
            box-shadow: 0 0 20px rgba(79, 192, 255, 0.4);
        }

        .viewer {
            width: 100%;
            height: calc(100vh - 240px);
            min-height: 600px;
            border: 1px solid rgba(79, 192, 255, 0.3);
            border-left: 3px solid #4fc0ff;
            border-radius: 4px;
            background: rgba(20, 20, 20, 0.5);
            box-shadow: 0 0 20px rgba(79, 192, 255, 0.1);
            overflow: hidden;
        }

        .viewer object {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Shown by browsers that can't display PDFs inline (most phones) */
        .fallback {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            text-align: center;
            font-family: 'Space Mono', monospace;
            color: #94a3b8;
        }

        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid #1a1a1a;
            margin-top: 40px;
            font-family: 'Space Mono', monospace;
            color: #64748b;
            font-size: 0.85em;
            position: relative;
            z-index: 1;
        }

        footer::before {
            content: '// ';
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .nav-container {
                gap: 20px;
                padding: 0 25px;
            }

            .nav-container a {
                font-size: 0.8em;
            }

            .container {
                padding: 110px 25px 40px;
            }

            .resume-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 30px;
            }

            .viewer {
                height: 70vh;
                min-height: 400px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html">home</a>
            <a href="index.html#experience">experience</a>
            <a href="index.html#projects">projects</a>
            <a href="resume.html" class="active">resume</a>
        </div>
    </nav>

    <div class="container">
        <div class="resume-header">
            <h2>resume</h2>
            <div class="actions">
                <a class="btn primary" href="Robert_Albani_Resume.pdf" download="Robert_Albani_Resume.pdf">download pdf</a>
                <a class="btn" href="Robert_Albani_Resume.pdf" target="_blank" rel="noopener">open in new tab</a>
            </div>
        </div>

        <div class="viewer">
            <object data="Robert_Albani_Resume.pdf#view=FitH" type="application/pdf">
                <div class="fallback">
                    <p>// your browser can't display the PDF here</p>
                    <a class="btn primary" href="Robert_Albani_Resume.pdf" target="_blank" rel="noopener">view resume</a>
                </div>
            </object>
        </div>
    </div>

    <footer>2025 Robert Albani</footer>
</body>
</html>
